services:
  - type: web
    name: foretagsboende
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CONTACT_EMAIL
        value: kontakt@bostadsuthyrning.se
      - key: LEAD_EMAIL
        value: kontakt@bostadsuthyrning.se
      # Hemliga värden sätts i Render-dashboarden (Environment → Add Secret),
      # alternativt via secret-filen /etc/secrets/.env som server.js läser.
      # Se docs/DRIFT.md för rotationsinstruktioner.
      - key: JWT_SECRET
        sync: false
      - key: GUESTY_CLIENT_ID
        sync: false
      - key: GUESTY_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Valfria: MAIL_FROM (verifierad Resend-avsändare, krävs för kundbekräftelser),
      # MAKE_WEBHOOK_URL (tom = webhook avstängd), EMAIL_DRY_RUN (endast lokal test).
